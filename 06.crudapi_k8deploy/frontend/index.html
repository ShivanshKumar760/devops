<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>darkroom — a small feed</title>
    <style>
      :root {
        --paper: #f4f1ea;
        --ink: #1f1c16;
        --rust: #b5512b;
        --rust-dark: #8f3f1f;
        --line: #d8d2c2;
        --muted: #7a7363;
        --card: #fffdf8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia,
          serif;
        min-height: 100vh;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 24px;
      }
      .brand {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.5px;
      }
      .brand span {
        color: var(--rust);
      }
      .topbar-right {
        display: flex;
        gap: 10px;
        align-items: center;
        font-family: -apple-system, sans-serif;
        font-size: 13px;
      }
      .pill {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        padding: 6px 14px;
        border-radius: 20px;
        border: 1px solid var(--ink);
        background: transparent;
        cursor: pointer;
        color: var(--ink);
      }
      .pill.primary {
        background: var(--rust);
        color: #fff;
        border-color: var(--rust);
      }
      .pill:hover {
        opacity: 0.85;
      }
      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #999;
        display: inline-block;
        margin-right: 6px;
        transition: background 0.3s;
      }
      .status-dot.live {
        background: #4a8c4a;
      }

      .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 24px 16px 80px;
      }

      /* auth screen */
      .auth-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 32px;
        margin-top: 40px;
      }
      .auth-card h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .auth-card p.sub {
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 24px;
        font-family: -apple-system, sans-serif;
      }
      .tabs {
        display: flex;
        gap: 0;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--line);
      }
      .tab {
        font-family: -apple-system, sans-serif;
        font-size: 13px;
        padding: 8px 0;
        margin-right: 24px;
        cursor: pointer;
        color: var(--muted);
        border-bottom: 2px solid transparent;
      }
      .tab.active {
        color: var(--ink);
        border-bottom-color: var(--rust);
        font-weight: 600;
      }
      label {
        display: block;
        font-family: -apple-system, sans-serif;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin-bottom: 4px;
        margin-top: 14px;
      }
      input[type="text"],
      input[type="email"],
      input[type="password"],
      textarea {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: #fff;
        font-family: -apple-system, sans-serif;
        font-size: 14px;
        color: var(--ink);
      }
      input:focus,
      textarea:focus {
        outline: 2px solid var(--rust);
        outline-offset: 1px;
        border-color: var(--rust);
      }
      .btn-full {
        width: 100%;
        margin-top: 20px;
        padding: 11px;
        border: none;
        border-radius: 3px;
        background: var(--rust);
        color: #fff;
        font-family: -apple-system, sans-serif;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-full:hover {
        background: var(--rust-dark);
      }
      .btn-full:disabled {
        background: #ccc;
        cursor: default;
      }
      .error-msg {
        margin-top: 14px;
        font-family: -apple-system, sans-serif;
        font-size: 13px;
        color: var(--rust-dark);
        background: #f9e9e3;
        border: 1px solid #e4b9a6;
        padding: 8px 10px;
        border-radius: 3px;
        display: none;
      }

      /* composer */
      .composer {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 18px;
        margin-bottom: 28px;
      }
      .composer textarea {
        resize: vertical;
        min-height: 48px;
        font-family: Georgia, serif;
        font-size: 15px;
      }
      .composer-row {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }
      .composer-row input {
        flex: 1;
      }
      .composer-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 10px;
      }
      .composer-actions button {
        font-family: -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 600;
        padding: 8px 18px;
        border: none;
        border-radius: 3px;
        background: var(--ink);
        color: var(--paper);
        cursor: pointer;
      }
      .composer-actions button:disabled {
        background: #bbb;
      }

      /* feed */
      .post {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 4px;
        margin-bottom: 22px;
        overflow: hidden;
      }
      .post-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }
      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--rust);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .post-head .uname {
        font-family: -apple-system, sans-serif;
        font-size: 14px;
        font-weight: 600;
      }
      .post-head .uname.clickable,
      .post-caption .uname.clickable {
        cursor: pointer;
      }
      .post-head .uname.clickable:hover,
      .post-caption .uname.clickable:hover {
        color: var(--rust-dark);
        text-decoration: underline;
      }
      .post-head .time {
        font-family: -apple-system, sans-serif;
        font-size: 11px;
        color: var(--muted);
        margin-left: auto;
      }
      .post img {
        width: 100%;
        display: block;
        background: #e9e5d8;
        max-height: 560px;
        object-fit: cover;
      }
      .post-body {
        padding: 12px 14px;
      }
      .post-caption {
        font-size: 15px;
        line-height: 1.45;
        margin: 0 0 10px;
      }
      .post-caption .uname {
        font-weight: 700;
        margin-right: 6px;
        font-family: Georgia, serif;
      }
      .post-actions {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .like-btn {
        background: none;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 5px 14px;
        cursor: pointer;
        font-family: -apple-system, sans-serif;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--ink);
      }
      .like-btn:hover {
        border-color: var(--rust);
        color: var(--rust-dark);
      }
      .like-btn.liked {
        background: var(--rust);
        border-color: var(--rust);
        color: #fff;
      }
      .like-btn:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .like-count {
        font-family: -apple-system, sans-serif;
        font-size: 13px;
        color: var(--muted);
      }

      .empty,
      .loading {
        text-align: center;
        color: var(--muted);
        font-family: -apple-system, sans-serif;
        font-size: 14px;
        padding: 40px 0;
      }
      .hidden {
        display: none !important;
      }

      .profile-header {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 24px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .profile-header .avatar {
        width: 56px;
        height: 56px;
        font-size: 20px;
      }
      .profile-header h2 {
        margin: 0 0 4px;
        font-size: 19px;
        font-family: Georgia, serif;
      }
      .profile-header .bio {
        font-family: -apple-system, sans-serif;
        font-size: 13px;
        color: var(--muted);
        margin: 0;
      }

      @media (max-width: 480px) {
        .topbar {
          padding: 12px 14px;
        }
        .wrap {
          padding: 16px 10px 60px;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">dark<span>room</span></div>
      <div class="topbar-right" id="topbarRight"></div>
    </div>

    <div class="wrap">
      <!-- AUTH VIEW -->
      <div id="authView" class="auth-card hidden">
        <div class="tabs">
          <div class="tab active" data-tab="login" id="tabLogin">Log in</div>
          <div class="tab" data-tab="signup" id="tabSignup">Sign up</div>
        </div>

        <div id="loginForm">
          <h1>Welcome back</h1>
          <p class="sub">Log in to see what's new in the feed.</p>
          <label for="loginUsername">Username</label>
          <input type="text" id="loginUsername" autocomplete="username" />
          <label for="loginPassword">Password</label>
          <input
            type="password"
            id="loginPassword"
            autocomplete="current-password"
          />
          <button class="btn-full" id="loginBtn">Log in</button>
        </div>

        <div id="signupForm" class="hidden">
          <h1>Create an account</h1>
          <p class="sub">Join darkroom — share a photo, follow the feed.</p>
          <label for="signupUsername">Username</label>
          <input type="text" id="signupUsername" autocomplete="username" />
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" autocomplete="email" />
          <label for="signupPassword">Password</label>
          <input
            type="password"
            id="signupPassword"
            autocomplete="new-password"
          />
          <button class="btn-full" id="signupBtn">Sign up</button>
        </div>

        <div class="error-msg" id="authError"></div>
      </div>

      <!-- FEED VIEW -->
      <div id="feedView" class="hidden">
        <div class="composer">
          <label style="margin-top: 0">New post</label>
          <textarea
            id="captionInput"
            placeholder="Write a caption..."
            rows="2"
          ></textarea>
          <div class="composer-row">
            <input
              type="text"
              id="imageUrlInput"
              placeholder="Image URL (https://...)"
            />
          </div>
          <div class="composer-actions">
            <button id="postBtn">Share</button>
          </div>
        </div>

        <div id="feedList"></div>
        <div class="loading" id="feedLoading">Loading feed…</div>
        <div class="empty hidden" id="feedEmpty">
          No posts yet. Be the first to share something.
        </div>
      </div>

      <!-- PROFILE VIEW -->
      <div id="profileView" class="hidden">
        <button class="pill" id="backToFeedBtn" style="margin-bottom: 18px">
          ← Back to feed
        </button>
        <div class="profile-header" id="profileHeader"></div>
        <div id="profilePosts"></div>
        <div class="loading hidden" id="profileLoading">Loading…</div>
        <div class="empty hidden" id="profileEmpty">
          No posts from this user yet.
        </div>
      </div>
    </div>

    <script>
      (function () {
        const API_BASE =
          window.location.origin.includes("null") ||
          window.location.protocol === "file:"
            ? "http://localhost:3000"
            : "http://localhost:3000";
        // Edit API_BASE above if your Flask server runs on a different host/port.

        const state = {
          token: localStorage.getItem("dr_token") || null,
          userId: localStorage.getItem("dr_user_id")
            ? parseInt(localStorage.getItem("dr_user_id"))
            : null,
          username: localStorage.getItem("dr_username") || null,
          likedPosts: new Set(
            JSON.parse(localStorage.getItem("dr_liked") || "[]")
          ),
          pollVersion: 0,
          posts: [], // ordered newest first, each {post_id, username, caption, image_url, created_at, like_count}
          polling: false,
          currentProfileId: null,
        };

        function saveLiked() {
          localStorage.setItem(
            "dr_liked",
            JSON.stringify(Array.from(state.likedPosts))
          );
        }

        function $(id) {
          return document.getElementById(id);
        }

        // ---------- Auth UI wiring ----------
        $("tabLogin").onclick = () => switchTab("login");
        $("tabSignup").onclick = () => switchTab("signup");

        function switchTab(name) {
          $("tabLogin").classList.toggle("active", name === "login");
          $("tabSignup").classList.toggle("active", name === "signup");
          $("loginForm").classList.toggle("hidden", name !== "login");
          $("signupForm").classList.toggle("hidden", name !== "signup");
          hideAuthError();
        }

        function showAuthError(msg) {
          const el = $("authError");
          el.textContent = msg;
          el.style.display = "block";
        }
        function hideAuthError() {
          $("authError").style.display = "none";
        }

        $("loginBtn").onclick = async () => {
          hideAuthError();
          const username = $("loginUsername").value.trim();
          const password = $("loginPassword").value;
          if (!username || !password) {
            showAuthError("Enter your username and password.");
            return;
          }
          setBtnLoading($("loginBtn"), true, "Log in");
          try {
            const res = await fetch(`${API_BASE}/login`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password }),
            });
            const data = await res.json();
            if (!res.ok) {
              showAuthError(data.error || "Login failed.");
              return;
            }
            // /login only returns a token — decode user_id from it (no verification needed client-side, just for display)
            const payload = decodeJwtPayload(data.token);
            setSession(data.token, payload.user_id, username);
            enterFeed();
          } catch (e) {
            showAuthError("Could not reach the server. Is the API running?");
          } finally {
            setBtnLoading($("loginBtn"), false, "Log in");
          }
        };

        $("signupBtn").onclick = async () => {
          hideAuthError();
          const username = $("signupUsername").value.trim();
          const email = $("signupEmail").value.trim();
          const password = $("signupPassword").value;
          if (!username || !email || !password) {
            showAuthError("Fill in all fields.");
            return;
          }
          setBtnLoading($("signupBtn"), true, "Sign up");
          try {
            const res = await fetch(`${API_BASE}/signup`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, email, password }),
            });
            const data = await res.json();
            if (!res.ok) {
              showAuthError(data.error || "Sign up failed.");
              return;
            }
            setSession(data.token, data.user.user_id, data.user.username);
            enterFeed();
          } catch (e) {
            showAuthError("Could not reach the server. Is the API running?");
          } finally {
            setBtnLoading($("signupBtn"), false, "Sign up");
          }
        };

        function setBtnLoading(btn, loading, label) {
          btn.disabled = loading;
          btn.textContent = loading ? "Please wait…" : label;
        }

        function decodeJwtPayload(token) {
          try {
            const base64 = token
              .split(".")[1]
              .replace(/-/g, "+")
              .replace(/_/g, "/");
            return JSON.parse(
              decodeURIComponent(
                atob(base64)
                  .split("")
                  .map(
                    (c) => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)
                  )
                  .join("")
              )
            );
          } catch (e) {
            return {};
          }
        }

        function setSession(token, userId, username) {
          state.token = token;
          state.userId = userId;
          state.username = username;
          localStorage.setItem("dr_token", token);
          localStorage.setItem("dr_user_id", String(userId));
          localStorage.setItem("dr_username", username || "");
        }

        function clearSession() {
          state.token = null;
          state.userId = null;
          state.username = null;
          localStorage.removeItem("dr_token");
          localStorage.removeItem("dr_user_id");
          localStorage.removeItem("dr_username");
        }

        function renderTopbar() {
          const right = $("topbarRight");
          if (state.token) {
            right.innerHTML = `
        <span><span class="status-dot" id="statusDot"></span><span id="statusLabel" style="color:var(--muted);">connecting</span></span>
        <span style="color:var(--muted);">@${escapeHtml(
          state.username || ""
        )}</span>
        <button class="pill" id="logoutBtn">Log out</button>
      `;
            $("logoutBtn").onclick = logout;
          } else {
            right.innerHTML = "";
          }
        }

        function logout() {
          clearSession();
          state.polling = false;
          showAuth();
        }

        function showAuth() {
          $("authView").classList.remove("hidden");
          $("feedView").classList.add("hidden");
          renderTopbar();
        }

        function enterFeed() {
          $("authView").classList.add("hidden");
          $("feedView").classList.remove("hidden");
          renderTopbar();
          loadFeed();
          if (!state.polling) {
            state.polling = true;
            pollLoop();
          }
        }

        // ---------- Feed rendering ----------
        function escapeHtml(str) {
          const d = document.createElement("div");
          d.textContent = str == null ? "" : String(str);
          return d.innerHTML;
        }

        function initials(name) {
          if (!name) return "?";
          return name.trim().slice(0, 2).toUpperCase();
        }

        function timeAgo(iso) {
          const then = new Date(
            iso.replace(" ", "T") + (iso.includes("Z") ? "" : "Z")
          );
          const diffMs = Date.now() - then.getTime();
          if (isNaN(diffMs)) return "";
          const mins = Math.floor(diffMs / 60000);
          if (mins < 1) return "just now";
          if (mins < 60) return `${mins}m ago`;
          const hrs = Math.floor(mins / 60);
          if (hrs < 24) return `${hrs}h ago`;
          const days = Math.floor(hrs / 24);
          return `${days}d ago`;
        }

        function renderFeed() {
          const list = $("feedList");
          if (state.posts.length === 0) {
            list.innerHTML = "";
            $("feedEmpty").classList.remove("hidden");
            return;
          }
          $("feedEmpty").classList.add("hidden");
          list.innerHTML = state.posts.map(postHtml).join("");
          state.posts.forEach((p) => {
            const btn = document.getElementById(`like-${p.post_id}`);
            if (btn) btn.onclick = () => likePost(p.post_id);
          });
          list.querySelectorAll(".uname.clickable").forEach((el) => {
            el.onclick = () => openProfile(parseInt(el.dataset.userId));
          });
        }

        function postHtml(p) {
          const liked = state.likedPosts.has(p.post_id);
          return `
      <div class="post">
        <div class="post-head">
          <div class="avatar">${escapeHtml(initials(p.username))}</div>
          <div class="uname clickable" data-user-id="${p.user_id}">${escapeHtml(
            p.username
          )}</div>
          <div class="time">${escapeHtml(timeAgo(p.created_at))}</div>
        </div>
        ${
          p.image_url
            ? `<img src="${escapeHtml(
                p.image_url
              )}" alt="post image" loading="lazy" onerror="this.style.display='none'">`
            : ""
        }
        <div class="post-body">
          ${
            p.caption
              ? `<p class="post-caption"><span class="uname clickable" data-user-id="${
                  p.user_id
                }">${escapeHtml(p.username)}</span>${escapeHtml(p.caption)}</p>`
              : ""
          }
          <div class="post-actions">
            <button class="like-btn ${liked ? "liked" : ""}" id="like-${
            p.post_id
          }" ${liked ? "disabled" : ""}>
              ${liked ? "♥ Liked" : "♡ Like"}
            </button>
            <span class="like-count" id="count-${p.post_id}">${p.like_count} ${
            p.like_count === 1 ? "like" : "likes"
          }</span>
          </div>
        </div>
      </div>
    `;
        }

        async function loadFeed() {
          $("feedLoading").classList.remove("hidden");
          try {
            const res = await fetch(`${API_BASE}/feed?limit=20&offset=0`);
            const data = await res.json();
            if (res.ok) {
              state.posts = data.map((p) => ({
                ...p,
                like_count: parseInt(p.like_count) || 0,
              }));
              renderFeed();
            }
          } catch (e) {
            // network issue — leave whatever is currently shown
          } finally {
            $("feedLoading").classList.add("hidden");
          }
        }

        // ---------- Composer ----------
        $("postBtn").onclick = async () => {
          const caption = $("captionInput").value.trim();
          const image_url = $("imageUrlInput").value.trim();
          if (!image_url) {
            alert("Add an image URL for the post.");
            return;
          }
          const btn = $("postBtn");
          btn.disabled = true;
          btn.textContent = "Sharing…";
          try {
            const res = await fetch(`${API_BASE}/posts`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${state.token}`,
              },
              body: JSON.stringify({ caption, image_url }),
            });
            const data = await res.json();
            if (!res.ok) {
              if (res.status === 401) {
                logout();
                return;
              }
              alert(data.error || "Could not create post.");
              return;
            }
            $("captionInput").value = "";
            $("imageUrlInput").value = "";
            // optimistic add — username isn't returned by /posts, so refresh the feed
            await loadFeed();
          } catch (e) {
            alert("Could not reach the server.");
          } finally {
            btn.disabled = false;
            btn.textContent = "Share";
          }
        };

        // ---------- Likes ----------
        async function likePost(postId) {
          if (!state.token) {
            return;
          }
          const btn = document.getElementById(`like-${postId}`);
          if (btn) btn.disabled = true;
          try {
            const res = await fetch(`${API_BASE}/posts/${postId}/like`, {
              method: "POST",
              headers: { Authorization: `Bearer ${state.token}` },
            });
            const data = await res.json();
            if (res.ok) {
              state.likedPosts.add(postId);
              saveLiked();
              updateLikeUI(postId, data.like_count, true);
            } else if (res.status === 409) {
              // already liked according to server — reflect that locally
              state.likedPosts.add(postId);
              saveLiked();
              if (btn) btn.classList.add("liked");
              if (btn) btn.textContent = "♥ Liked";
            } else if (res.status === 401) {
              logout();
            } else {
              if (btn) btn.disabled = false;
            }
          } catch (e) {
            if (btn) btn.disabled = false;
          }
        }

        function updateLikeUI(postId, count, liked) {
          const btn = document.getElementById(`like-${postId}`);
          const countEl = document.getElementById(`count-${postId}`);
          if (btn && liked) {
            btn.classList.add("liked");
            btn.textContent = "♥ Liked";
            btn.disabled = true;
          }
          if (countEl) {
            countEl.textContent = `${count} ${count === 1 ? "like" : "likes"}`;
          }
          const p = state.posts.find((p) => p.post_id === postId);
          if (p) p.like_count = count;
        }

        // ---------- Long polling for live updates ----------
        async function pollLoop() {
          const dot = () => $("statusDot");
          const label = () => $("statusLabel");
          while (state.polling && state.token) {
            try {
              const res = await fetch(
                `${API_BASE}/events/poll?since=${state.pollVersion}`
              );
              if (dot()) dot().classList.add("live");
              if (label()) label().textContent = "live";
              if (res.status === 200) {
                const event = await res.json();
                state.pollVersion = event.version;
                handleEvent(event);
              }
              // 204 = timeout, just loop again immediately
            } catch (e) {
              if (dot()) dot().classList.remove("live");
              if (label()) label().textContent = "reconnecting";
              await new Promise((r) => setTimeout(r, 2000));
            }
          }
        }

        function handleEvent(event) {
          if (event.type === "new_post") {
            // avoid duplicating a post we just created ourselves and already see
            if (!state.posts.some((p) => p.post_id === event.data.post_id)) {
              loadFeed();
            }
            // if we're viewing the profile of the user who just posted, refresh it
            if (
              state.currentProfileId &&
              state.currentProfileId === event.data.user_id
            ) {
              openProfile(state.currentProfileId);
            }
          } else if (event.type === "new_like" || event.type === "unlike") {
            const { post_id, like_count } = event.data;
            const p = state.posts.find((p) => p.post_id === post_id);
            if (p) p.like_count = like_count;
            // update the like count wherever it's currently on screen — feed or profile
            const countEl = document.getElementById(`count-${post_id}`);
            if (countEl)
              countEl.textContent = `${like_count} ${
                like_count === 1 ? "like" : "likes"
              }`;
          }
        }

        // ---------- Profile view ----------
        $("backToFeedBtn").onclick = closeProfile;

        function closeProfile() {
          state.currentProfileId = null;
          $("profileView").classList.add("hidden");
          $("feedView").classList.remove("hidden");
        }

        async function openProfile(userId) {
          if (!userId) return;
          state.currentProfileId = userId;
          $("feedView").classList.add("hidden");
          $("profileView").classList.remove("hidden");
          $("profileHeader").innerHTML = "";
          $("profilePosts").innerHTML = "";
          $("profileEmpty").classList.add("hidden");
          $("profileLoading").classList.remove("hidden");

          try {
            const [profileRes, postsRes] = await Promise.all([
              fetch(`${API_BASE}/users/${userId}`),
              fetch(`${API_BASE}/users/${userId}/posts?limit=20&offset=0`),
            ]);
            const profile = profileRes.ok ? await profileRes.json() : null;
            const posts = postsRes.ok ? await postsRes.json() : [];

            $("profileHeader").innerHTML = `
        <div class="avatar">${escapeHtml(
          initials(profile ? profile.username : "?")
        )}</div>
        <div>
          <h2>${escapeHtml(profile ? profile.username : "Unknown user")}</h2>
          <p class="bio">${escapeHtml(
            profile && profile.bio ? profile.bio : "No bio yet."
          )}</p>
        </div>
      `;

            const normalized = posts.map((p) => ({
              ...p,
              user_id: userId,
              like_count: parseInt(p.like_count) || 0,
            }));
            const postsEl = $("profilePosts");
            if (normalized.length === 0) {
              postsEl.innerHTML = "";
              $("profileEmpty").classList.remove("hidden");
            } else {
              postsEl.innerHTML = normalized.map(postHtml).join("");
              normalized.forEach((p) => {
                const btn = document.getElementById(`like-${p.post_id}`);
                if (btn) btn.onclick = () => likePost(p.post_id);
              });
            }
          } catch (e) {
            $(
              "profileHeader"
            ).innerHTML = `<p class="bio">Could not load this profile.</p>`;
          } finally {
            $("profileLoading").classList.add("hidden");
          }
        }

        // ---------- Boot ----------
        if (state.token) {
          enterFeed();
        } else {
          showAuth();
        }
      })();
    </script>
  </body>
</html>
