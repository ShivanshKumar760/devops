version: "3.8"

services:
  api:
    build:
      context: ../../ # Tells Docker the main root folder is the build context
      dockerfile: isolate_example_docker/container/dockerfile.example # Locates the Dockerfile starting from the context root
    ports:
      - "8000:3000" # Maps host port 8000 to internal Express port 3000
    environment:
      - RUNTIME_ENV=DOCKER
      # Passes the MongoDB connection string to your Express app
      - MONGO_URI=mongodb://db:27017/mydatabase
    depends_on:
      - db

  db:
    image: mongo:7.0 # Replaced postgres with official MongoDB 7.0 image
    ports:
      - "27017:27017" # Maps host port 27017 to internal MongoDB port 27017
    volumes:
      - mongo_data:/data/db # Keeps your database data safe when container restarts

# Defines the persistent volume for MongoDB storage
volumes:
  mongo_data:
