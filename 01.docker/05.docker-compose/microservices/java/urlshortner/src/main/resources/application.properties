# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── DataSource (PostgreSQL) ──────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${PG_HOST:postgres}:5432/${PG_DB:urlshortener}
spring.datasource.username=${PG_USER:postgres}
spring.datasource.password=${PG_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# ─── RabbitMQ ─────────────────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBIT_HOST:rabbitmq}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}

# ─── SQL Initialisation ───────────────────────────────────────────────────────
spring.sql.init.mode=always
# spring.sql.init.mode=always

# ─── App Config ───────────────────────────────────────────────────────────────
# Define the base URL for the application
app.base-url=${BASE_URL:http://localhost:8080}
app.exchange=url.events
app.cache-queue=cache_q
app.audit-queue=audit_q