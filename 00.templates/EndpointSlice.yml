apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: example-endpointslice
  namespace: default
  labels:
    kubernetes.io/service-name: example-service
addressType: IPv4
ports:
  - name: http
    port: 80
    protocol: TCP
endpoints:
  - addresses:
      - 10.0.0.1
    conditions:
      ready: true
    nodeName: node-1
