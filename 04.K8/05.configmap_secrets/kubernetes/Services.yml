apiVersion: v1
kind: Service
metadata:
  labels:
    app: api-deploy-cms
  name: api-deploy-service-cms
spec:
  ports:
    - port: 3000 # The port inside the cluster
      protocol: TCP
      targetPort: 3000 # The containerPort inside your pod
      nodePort: 31000 # Optional: Fixed external port for Kind access
  selector:
    app: api-deploy-demo-secrets-config # Crucial: Must match your deployment's matchLabels
  type: NodePort
