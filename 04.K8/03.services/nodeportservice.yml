apiVersion: v1
kind: Service

metadata:
  name: sample-nodeport-service

spec:
  type: NodePort

  selector:
    app: sample-deployment-two

  ports:
    - protocol: TCP
      port: 80 # Port exposed by the service
      targetPort: 80 # Port inside the container (nginx containerPort)

      nodePort: 30080
      # External port on node
      # Range: 30000-32767
