apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-operator
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nginx-operator
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["create", "delete", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nginx-operator
  namespace: default
subjects:
  - kind: ServiceAccount
    name: nginx-operator
    namespace: default
roleRef:
  kind: Role
  name: nginx-operator
  apiGroup: rbac.authorization.k8s.io
