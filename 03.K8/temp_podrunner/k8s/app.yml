apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-operator
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-operator
  template:
    metadata:
      labels:
        app: nginx-operator
    spec:
      # This is the key line — binds the mounted service account token
      # that loadFromCluster() will read at runtime
      serviceAccountName: nginx-operator
      containers:
        - name: api
          image: nginx-operator:latest
          # For Kind: image is loaded with `kind load docker-image`
          # so we never pull from a registry — must be IfNotPresent
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-operator
  namespace: default
spec:
  type: NodePort
  selector:
    app: nginx-operator
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30090 # hit the API at http://<node-ip>:30090
