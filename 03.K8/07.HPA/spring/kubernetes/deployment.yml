apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
        - name: service-a-container
          image: service-a
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "200Mi"
              cpu: "200m"
          ports:
            - containerPort: 8080
          env:
            - name: HELLO_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: microservices-config
                  key: HELLO_MESSAGE
            - name: TAX_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: microservices-secret
                  key: TAX_SERVICE_URL

