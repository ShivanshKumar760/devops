apiVersion: v1
kind: Service
metadata:
  name: service-b-entry
spec:
  selector:
    app: service-b
  type: ClusterIP
  ports:
    - port: 4010
      targetPort: 4000

---
apiVersion: v1
kind: Service
metadata:
  name: service-a-entry
spec:
  selector:
    app: service-a
  type: NodePort
  ports:
    - port: 3011
      targetPort: 3000
      nodePort: 30101
