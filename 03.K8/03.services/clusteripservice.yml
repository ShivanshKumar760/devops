#lets code a clusterip service for our nginx deployment
apiVersion: v1
kind: Service
metadata:
  name: sample-service
spec:
  selector:
    app: sample-deployment-two
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
