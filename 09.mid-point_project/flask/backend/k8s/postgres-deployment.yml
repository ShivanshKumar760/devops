apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres 
  namespace: dukaan
spec:
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        ports:
        - containerPort: 5432
        env:
          - name: POSTGRES_DB
            valueFrom:
              configMapKeyRef:
                key: DATABASE_NAME
                name: dukaan-config
          - name: POSTGRES_USER
            valueFrom:
              configMapKeyRef:
                key: DATABASE_USER
                name: dukaan-config
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                key: DATABASE_PASSWORD
                name: dukaa-secret
        volumeMounts:
          - name: postgres-storage
            mountPath: /var/lib/postgresql/data
    volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
